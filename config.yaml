automation:
  enabled: true
  timezone: UTC
  min_daily_runs: 7
  max_daily_runs: 15
  target_daily_average: 10
  different_count_each_day: true
  randomized_schedule: true
  minimum_interval_minutes: 30
  concurrent_runs: 1
repository:
  prefix: auto-calculator-
  private: true
  auto_delete: true
  delete_after_seconds: 60
security:
  verify_repository_owner: true
  verify_repository_id: true
  protect_existing_repositories: true
  dry_run: false
