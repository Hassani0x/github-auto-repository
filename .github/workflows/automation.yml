name: Repository lifecycle
on:
  schedule:
    - cron: '18,38,58 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the schedule without changing repositories or state
        type: boolean
        required: true
        default: true
permissions: {}
concurrency:
  group: repository-lifecycle
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.ref_name == github.event.repository.default_branch && (github.event_name == 'workflow_dispatch' || vars.LIVE_APPROVAL == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: automation-state
          path: .ledger
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt --disable-pip-version-check
      - name: Dispatch
        env:
          GH_AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          DELETION_APP_KEY: ${{ secrets.DELETION_APP_KEY }}
          DELETION_APP_CLIENT_ID: ${{ vars.DELETION_APP_CLIENT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LIVE_APPROVAL: ${{ vars.LIVE_APPROVAL }}
          PREVIEW: ${{ inputs.dry_run }}
        run: |
          if [[ "$PREVIEW" == "true" ]]; then
            python main.py --dry-run
          else
            python main.py
          fi
